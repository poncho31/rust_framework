<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 8 100 42">
  <title>Agent IA Icon</title>
  <desc>Icône en gris pour extension VS Code avec un "I" et un "A" remplaçant les yeux et le texte "AGENT" positionné à droite, plus à gauche et plus haut</desc>
  <g stroke="#808080" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Forme de la tête -->
    <path d="M16 22 a4 4 0 0 1 4 -4 h24 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 z"/>
    <!-- Antenne -->
    <line x1="32" y1="22" x2="32" y2="12"/>
    <circle cx="32" cy="10" r="2"/>
    <!-- Lettre I (œil gauche) -->
    <rect x="20" y="29" width="8" height="2" fill="#808080" stroke="none"/>
    <rect x="23" y="31" width="2" height="6" fill="#808080" stroke="none"/>
    <rect x="20" y="37" width="8" height="2" fill="#808080" stroke="none"/>
    <!-- Lettre A (œil droit) avec trou intérieur -->
    <path d="
      M 40,29 
      L 35,39 
      L 45,39 
      Z
      M 40,33 
      L 37,37 
      L 43,37 
      Z" 
      fill="#808080" fill-rule="evenodd" stroke="none"/>
    <!-- Bouche (sourire) -->
    <path d="M22 44 Q32 50 42 44"/>
  </g>
  <!-- Texte AGENT déplacé plus à gauche et plus haut -->
  <text x="50" y="36" text-anchor="start" dominant-baseline="middle" fill="#808080" font-size="14" font-family="sans-serif" font-weight="bold">
    AGENT
  </text>
</svg>
