<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mise à jour: ajout de img-src dans la politique CSP -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src ${webview.cspSource} blob: data:; connect-src http://127.0.0.1:8000; script-src ${webview.cspSource} 'unsafe-inline'; style-src ${webview.cspSource} 'unsafe-inline';">
  <title>Chat IA Agent Sidebar</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --fg: #d4d4d4;
      --primary: #007acc;
      --primary-hover: #005a9e;
      --danger: #ff5252;
      --danger-hover: #e04040;
      --warning: #ff9800;
      --warning-hover: #e07b00;
      --secondary: #252526;
      --border: #3c3c3c;
      --input-bg: #3c3c3c;
      --input-fg: #ffffff;
      --shadow: rgba(0, 0, 0, 0.3);
      --header-bg: #252526;
      --header-border: #3c3c3c;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    #main {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: 10px;
      padding-bottom: 10px;
      box-sizing: border-box;
    }
    #header {
      background: var(--header-bg);
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid var(--header-border);
      box-shadow: 0 1px 3px var(--shadow);
      margin-bottom: 10px;
    }
    #header h1 {
      margin: 0;
      font-size: 1.6em;
    }
    #link {
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center; /* added to vertically center the logo and buttons */
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .btn {
      height: 25px;
      padding: 4px 8px;
      font-size: 1em; 
      font-weight: bold; 
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff; 
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, transform 0.2s ease; /* added transition effect */
    }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { 
      background: var(--primary-hover);
      transform: scale(1.05); /* added scale effect on hover */
      color: #fff; 
    }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { 
      background: var(--danger-hover);
      transform: scale(1.05); /* added scale effect on hover */
      color: #fff; 
    }
    .btn-warning { background: var(--warning); }
    .btn-warning:hover { 
      background: var(--warning-hover);
      transform: scale(1.05); /* added scale effect on hover */
      color: #fff; 
    }
    .btn-success { background: #28a745; }
    .btn-success:hover { 
      background: #218838;
      transform: scale(1.05);
      color: #fff; 
    }
    .btn-info { background: #17a2b8; }
    .btn-info:hover { 
      background: #138496;
      transform: scale(1.05);
      color: #fff; 
    }
    #chat-container {
      flex: 1;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    #chat-log {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--secondary);
      padding: 10px;
      overflow-y: auto;
      border-radius: 6px;
      box-shadow: inset 0 1px 3px var(--shadow);
    }
    #chat-log div { 
      margin-bottom: 8px;
      word-wrap: break-word;
    }
    #chat-log div strong { color: var(--primary); }
    #input-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #chat-input {
      flex: 1;
      padding: 10px;
      font-size: 1em;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--input-fg);
      border-radius: 4px;
      outline: none;
    }
    #chat-input::placeholder { color: #9a9a9a; }
  </style>
  
</head>
<body>
  <div id="main">

    <div id="link">
      <a href="https://github.com/poncho31/rust_framework" target="_blank">
        <img src="${ia_agent_logo.svg}" height="70" alt="IA AGENT">
      </a>
      <!-- Adapted: using onclick to post the runCommand message -->
      <a class="btn btn-primary" href="#" onclick="vscode.postMessage({ command: 'runCommand', commandName: 'ia-agent.openChat' });">Rust</a>
      <a class="btn btn-danger" href="https://github.com/poncho31/rust_framework" target="_blank">Git</a>
      <a class="btn btn-warning" href="https://github.com/poncho31/rust_framework" target="_blank">Docs</a>
      <a class="btn btn-success" href="https://github.com/poncho31/rust_framework" target="_blank">Success</a>
      <a class="btn btn-info" href="https://github.com/poncho31/rust_framework" target="_blank">Info</a>
    </div>
    <!-- Section 1: Header -->

    <!-- Section 2: Chat Log -->
    <div id="chat-container">
      <div id="chat-log"></div>
    </div>
    <!-- Section 3: Input -->
    <div id="input-container">
      <input type="text" id="chat-input" placeholder="Tapez votre message ici..." />
      <a class="btn btn-primary" id="send-btn">Envoyer</a>
    </div>
  </div>
  
  <script type="module" src="${resource_js}"></script>
  <script>
    const vscode = acquireVsCodeApi();
    const sendBtn = document.getElementById('send-btn');
    if (sendBtn) {
        sendBtn.addEventListener('click', function() {
            initChat(this.id);
        });
    }
  </script>
</body>
</html>
